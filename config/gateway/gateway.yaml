apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: f-operator
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          image: envoyproxy/envoy:distroless-v1.39.2@sha256:dced08cf7c472e1a1d067f906878266078eeeb63c110b4961882c039a622853a
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  protocol: TCP
                  targetPort: 10080
                  nodePort: 30492
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: f-operator
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: f-operator
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: f-operator
  namespace: envoy-gateway-system
spec:
  gatewayClassName: f-operator
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [keys, media, oauth, tipp, minecraft, monitoring]
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
---
# Host NGINX is the one trusted forwarding hop. Direct internal clients remain HTTP.
# NodePort must remain reachable only from the Pi/internal network, never internet.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: host-proxy
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: f-operator
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  scheme: Preserve
---
# Preserve the old ingress idle-timeout behavior without Envoy's short total timeout.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: application-timeouts
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: f-operator
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 60s
