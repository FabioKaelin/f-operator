# Independently managed; f-operator must never adopt this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: f-operator
      namespace: envoy-gateway-system
      sectionName: http
  hostnames: [grafana.dev.fabkli.ch]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: grafana
          port: 80
