name: Validate and release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test
      - run: make build
      - run: make test-envoy
      - run: git diff --exit-code
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/fabiokaelin/f-operator:${{ steps.version.outputs.version }}
      - name: Render immutable installation artifact
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          make kustomize
          cd config/manager
          ../../bin/kustomize edit set image controller=ghcr.io/fabiokaelin/f-operator@${IMAGE_DIGEST}
          cd ../..
          mkdir -p dist
          bin/kustomize build config/default > dist/install.yaml
          printf '%s\n' "ghcr.io/fabiokaelin/f-operator@${IMAGE_DIGEST}" > dist/image.txt
          cp -r config/gateway dist/gateway
          cp docs/migration.md dist/migration.md
          tar -czf dist/gateway-config.tar.gz -C dist gateway
          (cd dist && sha256sum install.yaml image.txt gateway-config.tar.gz migration.md > SHA256SUMS)
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/install.yaml dist/image.txt dist/gateway-config.tar.gz dist/migration.md dist/SHA256SUMS --title "f-operator $GITHUB_REF_NAME" --notes-file docs/release-notes.md
# Deliberately no cluster credentials, kubectl apply, deployment job or automatic rollout.
