name: Validate and release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: python3 -m unittest discover -s pressure -p 'test_*.py'
      - run: bash -n controlplane/*.sh && python3 -m unittest discover -s controlplane -p 'test_*.py'
      - run: make test
      - run: make build
      - run: make test-envoy
      - run: python3 hack/test-nginx.py --image nginx:stable --image nginx:stable-alpine
      - run: git diff --exit-code
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - name: Version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/fabiokaelin/f-operator:${{ steps.version.outputs.version }}
      - name: Render immutable installation artifact
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          make kustomize
          cd config/manager
          ../../bin/kustomize edit set image controller=ghcr.io/fabiokaelin/f-operator@${IMAGE_DIGEST}
          cd ../..
          mkdir -p dist
          bin/kustomize build config/default > dist/install.yaml
          printf '%s\n' "ghcr.io/fabiokaelin/f-operator@${IMAGE_DIGEST}" > dist/image.txt
          cp -r config/gateway dist/gateway
          cp docs/migration.md dist/migration.md
          cp docs/nginx-compatibility.md dist/nginx-compatibility.md
          tar -czf dist/gateway-config.tar.gz -C dist gateway
          (cd dist && sha256sum install.yaml image.txt gateway-config.tar.gz migration.md nginx-compatibility.md > SHA256SUMS)
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/install.yaml dist/image.txt dist/gateway-config.tar.gz dist/migration.md dist/nginx-compatibility.md dist/SHA256SUMS --title "f-operator $GITHUB_REF_NAME" --notes-file docs/release-notes.md
  deploy:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kube
        with:
          kube_pwd: ${{ secrets.KUBE_PWD }}
      - name: Install tested API and exact released controller
        env:
          OPERATOR_IMAGE: ghcr.io/fabiokaelin/f-operator@${{ needs.release.outputs.image_digest }}
        run: |
          kubectl apply -f config/crd/bases
          kubectl apply -f pressure/priorities.json
          kubectl set image deployment/f-operator-controller-manager -n f-operator-system manager="$OPERATOR_IMAGE"
          python3 pressure/wait-ready.py deployment/f-operator-controller-manager f-operator-system
          python3 pressure/apply-priorities.py
      - name: Install pressure guard without replacing recovery state
        run: |
          state=$(kubectl get configmap pressure-state -n f-operator-system --ignore-not-found -o name)
          if [ -z "$state" ]; then
            kubectl create configmap pressure-state -n f-operator-system --from-literal='state.json={}'
          fi
          python3 pressure/render.py > /tmp/pressure.json
          kubectl apply -f /tmp/pressure.json
          python3 pressure/wait-ready.py deployment/pressure-guard f-operator-system
