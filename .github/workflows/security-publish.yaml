name: Security image publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: security-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.sum
      - name: Update and check Go dependencies
        working-directory: .
        run: |
          go get google.golang.org/grpc@v1.79.3
          go mod tidy
          make test
      - uses: actions/upload-artifact@v4
        with:
          name: operator-dependency-locks
          path: |
            go.mod
            go.sum
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          pull: true
          push: true
          tags: ghcr.io/fabiokaelin/f-operator:security-20261029
