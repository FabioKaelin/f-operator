name: Security image publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: security-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.sum
      - name: Update and check Go dependencies
        working-directory: .
        run: |
          go get -u=patch ./...
          go get google.golang.org/grpc@v1.79.3
          go mod tidy
          go test ./...
      - name: Publish dependency sources to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ./go.mod ./go.sum
          if ! git diff --cached --quiet; then
            git commit -m 'Update Go dependencies for security rebuild [skip ci]'
            git push origin HEAD:main
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          pull: true
          push: true
          tags: ghcr.io/fabiokaelin/f-operator:security-20261029
