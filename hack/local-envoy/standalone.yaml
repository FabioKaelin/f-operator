apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyGateway
gateway:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
provider:
  type: Custom
  custom:
    resource:
      type: File
      file:
        paths: [/tmp/envoy-gateway/config]
    infrastructure:
      type: Host
      host:
        configHome: /tmp/envoy-gateway
        dataHome: /tmp/envoy-gateway
logging:
  level:
    default: info
extensionApis:
  enableBackend: true
